<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Laundry Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: a quiet utility page. "Now" is a grid of machine tiles (live state),
   "Plan" turns a fixed washer cycle and a stepped dryer time into a minute-accurate timeline,
   then finds slots with no class and the best odds of a free machine on arrival.
   Palette: warm neutrals, one blue accent, status colours only for machine state.
   Two interface languages (English, Simplified Chinese) share one string table in the script. */
:root {
  --font-display: "Bricolage Grotesque", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-body: "DM Sans", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --bg: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6d68;
  --line: #e1e0d9;
  --line-strong: #c3c2b7;
  --accent: #1c5cab;
  --on-accent: #ffffff;
  --series-1: #2a78d6;
  --good: #0ca30c;
  --soon: #eb6834;
  --off: #898781;
  --track: #e1e0d9;
  --hatch: #a5a39b;
  --focus: #1c5cab;
  --h0: #cde2fb;
  --h1: #86b6ef;
  --h2: #3987e5;
  --h3: #1c5cab;
  --h4: #0d366b;
  --seg-wash: #86b6ef;
  --seg-dry: #f2a37f;
  --seg-move: #c3c2b7;
  --seg-ink: #0b0b0b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #a09e96;
    --line: #2c2c2a; --line-strong: #383835; --accent: #3987e5; --on-accent: #0b0b0b;
    --series-1: #3987e5; --track: #2c2c2a; --hatch: #55534e; --focus: #86b6ef;
    --h0: #222a33; --h1: #184f95; --h2: #256abf; --h3: #3987e5; --h4: #86b6ef;
    --seg-wash: #3987e5; --seg-dry: #eb6834; --seg-move: #383835;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #a09e96;
  --line: #2c2c2a; --line-strong: #383835; --accent: #3987e5; --on-accent: #0b0b0b;
  --series-1: #3987e5; --track: #2c2c2a; --hatch: #55534e; --focus: #86b6ef;
  --h0: #222a33; --h1: #184f95; --h2: #256abf; --h3: #3987e5; --h4: #86b6ef;
  --seg-wash: #3987e5; --seg-dry: #eb6834; --seg-move: #383835;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 980px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; }

/* header, tabs, language switch */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1.15; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--ink-2); font-size: 0.9rem; }
.ctrls { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); }
.tabs button { border: 0; background: transparent; padding: 7px 18px; border-radius: 7px; font-weight: 500; cursor: pointer; color: var(--ink-2); }
.tabs button[aria-selected="true"], .tabs button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.tabs.lang button { padding: 7px 12px; }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.field { display: flex; align-items: center; gap: 8px; }
.field label { color: var(--ink-2); font-size: 0.85rem; }
select { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 10px; min-height: 36px; }
.btn { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 12px; min-height: 36px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--ink-2); }
.btn.sq { width: 36px; padding: 0; font-size: 1.15rem; line-height: 1; }
.btn:disabled, select:disabled { opacity: 0.45; cursor: not-allowed; }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
output { min-width: 5.2rem; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.9rem; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 7px; font-size: 0.82rem; font-weight: 500; padding: 4px 10px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); flex: none; }
.chip.live .dot { background: var(--good); }
.spacer { flex: 1 1 auto; }
.stamp { color: var(--muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
.notice { margin: 0; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink-2); font-size: 0.88rem; }

/* summary tiles */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; }
.tile .k { color: var(--ink-2); font-size: 0.85rem; }
.tile .v { font-family: var(--font-display); font-weight: 700; font-size: 2.4rem; line-height: 1.05; }
.tile .v small { font-family: var(--font-body); font-weight: 400; font-size: 0.95rem; color: var(--ink-2); margin-left: 6px; }
.tile .n { color: var(--ink-2); font-size: 0.88rem; }

/* machine grid */
h2 { font-family: var(--font-display); font-size: 1.15rem; margin: 0 0 10px; font-weight: 600; }
.machines { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.m { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-width: 0; }
.m .id { font-weight: 700; font-size: 0.95rem; }
.m .st { font-weight: 500; font-size: 0.9rem; }
.m .sb { color: var(--ink-2); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.ring { --p: 50; --c: var(--series-1); width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--track) 0); }
.ring span { width: 42px; height: 42px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.ring.soon { --c: var(--soon); }
.badge { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; }
.badge.free { background: var(--good); color: #fff; }
.badge.off { border: 2px dashed var(--off); color: var(--ink-2); }
.badge svg { width: 26px; height: 26px; }

/* plan */
.panel-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
@media (min-width: 860px) { .panel-grid { grid-template-columns: minmax(0, 340px) minmax(0, 1fr); align-items: start; } }
.recs { display: grid; gap: 10px; }
.rec-card { display: flex; align-items: flex-start; gap: 12px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.rec-card[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.rec-card.nowc { cursor: default; }
.rec-card .rk { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-weight: 700; margin-top: 1px; }
.rec-card.nowc .rk { width: 36px; height: 36px; font-size: 0.7rem; }
.rec-body { display: grid; gap: 6px; min-width: 0; flex: 1; }
.rec-card .t { font-weight: 700; }
.rec-card .s { color: var(--ink-2); font-size: 0.86rem; }
.rec-card .l { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--ink-2); }
.bar { display: flex; gap: 2px; height: 22px; }
.seg { display: block; min-width: 0; border-radius: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 6px; font-style: normal; font-size: 0.72rem; font-weight: 700; line-height: 22px; color: var(--seg-ink); }
.seg.wash { background: var(--seg-wash); }
.seg.move { background: var(--seg-move); padding: 0; }
.seg.dry { background: var(--seg-dry); }
.steps { display: grid; gap: 2px; font-size: 0.86rem; }
.steps .st b { font-variant-numeric: tabular-nums; margin-right: 8px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
.empty { padding: 14px; border: 1px dashed var(--line-strong); border-radius: 12px; color: var(--ink-2); }
.tt { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.tt-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid { display: grid; grid-template-columns: 2.9rem repeat(7, minmax(0, 1fr)); gap: 2px; }
.gh { font-size: 0.78rem; font-weight: 700; text-align: center; color: var(--ink-2); padding-bottom: 3px; }
.gh.today { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.gl { font-size: 0.74rem; color: var(--muted); text-align: right; padding-right: 6px; align-self: center; font-variant-numeric: tabular-nums; }
.gl.nowrow { color: var(--ink); font-weight: 700; }
.cell { position: relative; height: 30px; width: 100%; border: 0; border-radius: 4px; padding: 0; cursor: pointer; display: grid; place-items: center; background: var(--h0); color: var(--ink); font-size: 0.7rem; font-weight: 700; touch-action: manipulation; }
.cell.l0 { background: var(--h0); } .cell.l1 { background: var(--h1); } .cell.l2 { background: var(--h2); }
.cell.l3 { background: var(--h3); } .cell.l4 { background: var(--h4); }
.cell.blk { background-color: var(--surface); background-image: repeating-linear-gradient(135deg, var(--hatch) 0 2px, transparent 2px 7px); box-shadow: inset 0 0 0 1px var(--line-strong); }
.cell .lbl { display: none; }
.cell.blk .lbl { display: inline; background: var(--surface); padding: 0 3px; border-radius: 3px; color: var(--ink-2); }
.cell.past { opacity: 0.45; }
.cell.rec { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); z-index: 1; }
.cell .rank { position: absolute; top: 2px; left: 2px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-size: 0.68rem; line-height: 1; padding: 0 3px; }
@media (max-width: 520px) { .cell { height: 28px; } .cell.blk .lbl { display: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 0.8rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .hatch { background-color: var(--surface); background-image: repeating-linear-gradient(135deg, var(--hatch) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px var(--line-strong); }
.legend .ringsw { background: transparent; box-shadow: 0 0 0 2px var(--ink); }
.fine { color: var(--ink-2); font-size: 0.84rem; margin: 0; }
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--surface); border-radius: 8px; padding: 7px 10px; font-size: 0.8rem; line-height: 1.35; max-width: 230px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
footer { color: var(--muted); font-size: 0.8rem; }
footer p { margin: 0 0 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div>
      <h1 data-i18n="title">Laundry Planner</h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <div class="ctrls">
      <nav class="tabs" role="tablist" data-i18n-aria="tabsAria">
        <button role="tab" id="tab-now" aria-controls="panel-now" aria-selected="true" data-i18n="tabNow"></button>
        <button role="tab" id="tab-plan" aria-controls="panel-plan" aria-selected="false" tabindex="-1" data-i18n="tabPlan"></button>
      </nav>
      <div class="tabs lang" role="group" data-i18n-aria="langAria">
        <button type="button" id="lang-en" lang="en" aria-pressed="true">EN</button>
        <button type="button" id="lang-zh" lang="zh-Hans" aria-pressed="false">中文</button>
      </div>
    </div>
  </header>

  <main>
    <!-- NOW -->
    <section id="panel-now" role="tabpanel" aria-labelledby="tab-now" class="wrap" style="gap:16px">
      <div class="toolbar">
        <div class="field"><label for="hall" data-i18n="hallLbl"></label><select id="hall"></select></div>
        <span id="src" class="chip"><span class="dot"></span><span id="srcText"></span></span>
        <button id="refresh" class="btn" type="button" data-i18n="refresh"></button>
        <button id="tryLive" class="btn" type="button" data-i18n="tryLive" hidden></button>
        <span class="spacer"></span>
        <span id="stamp" class="stamp"></span>
      </div>
      <p id="notice" class="notice" role="status" hidden></p>
      <div class="summary" id="summary" aria-live="polite"></div>
      <div>
        <h2 data-i18n="washers"></h2>
        <ul class="machines" id="washers"></ul>
      </div>
      <div>
        <h2 data-i18n="dryers"></h2>
        <ul class="machines" id="dryers"></ul>
      </div>
    </section>

    <!-- PLAN -->
    <section id="panel-plan" role="tabpanel" aria-labelledby="tab-plan" class="wrap" style="gap:14px" hidden>
      <div class="toolbar">
        <span class="chip" id="washFixed"></span>
        <label class="check"><input type="checkbox" id="use-dry" checked><span data-i18n="useDryer"></span></label>
        <div class="field">
          <label for="dry-val" data-i18n="dryLbl"></label>
          <div class="stepper" role="group" data-i18n-aria="dryAria">
            <button type="button" id="dry-minus" class="btn sq" data-i18n-aria="dryMinus">−</button>
            <output id="dry-val"></output>
            <button type="button" id="dry-plus" class="btn sq" data-i18n-aria="dryPlus">+</button>
          </div>
        </div>
        <div class="field"><label for="move" data-i18n="moveLbl"></label><select id="move"></select></div>
        <span class="chip" id="total"></span>
      </div>
      <div class="toolbar">
        <button id="sample" class="btn" type="button" data-i18n="sample"></button>
        <button id="clear" class="btn" type="button" data-i18n="clear"></button>
        <span class="fine" data-i18n="planHint"></span>
      </div>
      <div class="panel-grid">
        <div>
          <h2 data-i18n="bestTimes"></h2>
          <div class="recs" id="recs" aria-live="polite"></div>
          <p class="fine" style="margin-top:12px" data-i18n="bestNote"></p>
        </div>
        <div class="tt">
          <div class="tt-head">
            <h2 style="margin:0" data-i18n="yourWeek"></h2>
            <span class="stamp" data-i18n="dragHint"></span>
          </div>
          <div class="grid" id="grid" role="group" data-i18n-aria="gridAria"></div>
          <div class="legend" id="legend"></div>
          <p class="fine" data-i18n="privacy"></p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p data-i18n="footA"></p>
    <p data-i18n="footB"></p>
  </footer>
</div>
<div id="tip" role="tooltip" hidden></div>

<script>
(() => {
  'use strict';

  /* ---------- strings: add a language by adding one more object here ---------- */
  const STR = {

  };
  const LANG_KEY = 'laundry-planner.lang';

    const p = Object.fromEntries(dtf.formatToParts(new Date(tm)).map(x => [x.type, x.value]));

  const inText = min => {

  /* ---------- typical busyness model (demo) ---------- */
  const gauss = (x, mu, s) => Math.exp(-((x - mu) ** 2) / (2 * s * s));
  // x is the hour of day as a decimal, e.g. 14.5 is 14:30
  function busyAt(d, x) {
    const weekday = d < 5;

    if (d === 6) v += 0.12 * gauss(x, 19, 3);
    if (d === 4) v -= 0.1 * gauss(x, 21, 2);

  function parseTime(s) {
    if (!s) return null;

    return Number.isNaN(tm) ? null : tm;
  }
  function parseMachine(raw, now) {
    const type = raw['Machine Type'] === 'W' ? 'washer' : 'dryer';
    const id = parseInt(raw['Machine ID'], 10);
    const left = Number(raw['Left Time']);
    const updated = parseTime(raw['Last Update']);
    const ageMin = updated == null ? Infinity : (now - updated) / 60000;
    let state;
    if (raw['Status'] === 'U' || left >= 999 || ageMin > STALE_MIN) state = 'offline';
    else if (left > 0) state = left <= SOON_MIN ? 'soon' : 'busy';
    else state = 'free';
    return { type, id, left, ageMin, state };
  }
  function hash(...parts) {
    let h = 2166136261;
    for (const p of parts) {
      const n = typeof p === 'number' ? p : String(p).split('').reduce((s, c) => (s * 31 + c.charCodeAt(0)) | 0, 7);
      h ^= n; h = Math.imul(h, 16777619);
    }
    h ^= h >>> 13; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 16;

  }
  function demoData(hall, tm = Date.now()) {
    const { d, h } = hkNow(tm);

    for (const type of ['W', 'D']) {
      const cycle = type === 'W' ? WASH_MIN : 55;
      const count = type === 'W' ? 6 + (hall % 3) : 4 + (hall % 2);
      for (let id = 1; id <= count; id++) {
        const key = hall * 100 + id * 2 + (type === 'W' ? 0 : 1);
        const tMin = tm / 60000 + hash(key, 'phase') * cycle;
        const slot = Math.floor(tMin / cycle);
        const inUse = hash(key, slot) < b;
        const left = inUse ? Math.max(1, Math.ceil(cycle - (tMin % cycle))) : 0;
        const dead = type === 'W' && id === 2;     // mirrors the real feed: one machine silent for days
        out.push({
          'Machine Type': type,
          'Machine ID': pad(id),
          'Status': dead ? 'U' : 'A',
          'Left Time': String(dead ? 999 : left).padStart(3, '0'),
          'Last Update': new Date(dead ? tm - 4 * 864e5 : tm - hash(key, 'age', Math.floor(tm / 20000)) * 50000).toISOString()

  const S = {

  /* ---------- NOW tab ---------- */
  async function load() {

  function summarise(items, type) {

  /* ---------- PLAN tab ---------- */
  // Minutes from washer start: when the dryer starts, and when everything is finished.
  function shapeOf(o) {

  function recommend(now, o, blocked) {
    const sh = shapeOf(o);
    const nowMin = now.h * 60 + now.m;
    const found = [];
    for (let off = 0; off < 7; off++) {
      const d = (now.d + off) % 7;
      for (let s = DAY_START; s + sh.end <= DAY_END; s += START_STEP) {
        if (off === 0 && s <= nowMin) continue;
        let ok = true;
        for (let h = Math.floor(s / 60); h <= Math.floor((s + sh.end - 1) / 60); h++) {
          if (blocked.has(d + '-' + h)) { ok = false; break; }

        const bw = busyAt(d, s / 60);
        const bd = o.useDryer ? busyAt(d, (s + sh.dryStart) / 60) : null;

      }
    }
    found.sort((a, b) => a.score - b.score || a.off - b.off || a.start - b.start);
    const picked = [];
    for (const c of found) {
      if (picked.some(p => p.off === c.off && c.start < p.end && p.start < c.end)) continue;
      picked.push(c);
      if (picked.length === 3) break;
    }
    return picked;
  }

  function bar() {
    const segs = [el('i', { class: 'seg wash', style: 'flex:' + WASH_MIN, text: t('segWash', { n: WASH_MIN }) })];
    if (S.useDryer) {
      if (S.moveMin > 0) segs.push(el('i', { class: 'seg move', style: 'flex:' + S.moveMin }));
      segs.push(el('i', { class: 'seg dry', style: 'flex:' + S.dryMin, text: t('segDry', { n: S.dryMin }) }));
    }
    return el('span', { class: 'bar', 'aria-hidden': 'true' }, segs);
  }
  function steps(start) {
    const sh = shapeOf(S);
    const rows = [[start, t('stepWash', { n: WASH_MIN })]];
    if (S.useDryer) {
      if (S.moveMin > 0) rows.push([start + WASH_MIN, t('stepMove', { n: S.moveMin })]);
      rows.push([start + sh.dryStart, t('stepDry', { n: S.dryMin })]);
    }
    rows.push([start + sh.end, t('stepDone')]);
    return el('span', { class: 'steps' }, rows.map(([m, text]) => el('span', { class: 'st' }, el('b', { text: clock(m) }), text)));
  }
  // What happens if you walk in right now, using the latest machine readings for the selected hall.
  function nowCard() {
    if (!S.raw.length) return null;
    const now = Date.now(), hk = hkNow(), nowMin = hk.h * 60 + hk.m, sh = shapeOf(S);
    const items = S.raw.map(r => parseMachine(r, now));
    const washers = items.filter(m => m.type === 'washer');
    const dryers = items.filter(m => m.type === 'dryer');
    const freeW = washers.filter(m => m.state === 'free');
    const lines = [];
    let startAt = null;
    if (freeW.length) { startAt = nowMin; lines.push(t('nowWasher', { ids: freeW.map(m => 'W' + m.id).join(', ') })); }
    else {
      const running = washers.filter(m => m.state === 'busy' || m.state === 'soon');
      if (running.length) { const wait = Math.min(...running.map(m => m.left)); startAt = nowMin + wait; lines.push(t('nowWasherWait', { n: wait })); }
      else lines.push(t('nowWasherNone'));
    }
    if (startAt != null) {
      if (S.useDryer) {
        const dryAt = startAt + sh.dryStart, delta = dryAt - nowMin;
        const ready = dryers.filter(m => m.state === 'free' || ((m.state === 'busy' || m.state === 'soon') && m.left <= delta)).length;
        lines.push(t('nowDryer', { time: clock(dryAt), n: ready, m: dryers.filter(m => m.state !== 'offline').length }));
      }
      lines.push(t('nowDone', { time: clock(startAt + sh.end) }));
    }
    if (S.source === 'demo') lines.push(t('nowDemo'));
    return el('div', { class: 'rec-card nowc' },
      el('span', { class: 'rk', text: t('nowBadge') }),
      el('span', { class: 'rec-body' },
        el('span', { class: 't', text: t('nowTitle', { time: clock(nowMin), n: S.hall }) }),
        lines.map(l => el('span', { class: 's', text: l }))));
  }

  function renderRecs() {
    const now = hkNow();
    const sh = shapeOf(S);
    // controls reflect the state
    $('#washFixed').textContent = t('washFixed', { n: WASH_MIN });
    $('#total').textContent = t('total', { x: inText(sh.end) });
    $('#dry-val').textContent = t('fMin', { n: S.dryMin });
    $('#use-dry').checked = S.useDryer;
    $('#dry-minus').disabled = !S.useDryer || S.dryMin <= DRY_MIN;
    $('#dry-plus').disabled = !S.useDryer || S.dryMin >= DRY_MAX;
    $('#move').disabled = !S.useDryer;

    S.recs = recommend(now, S, S.blocked);
    if (S.sel >= S.recs.length) S.sel = 0;
    const box = $('#recs');
    const kids = [nowCard()];
    if (!S.recs.length) {
      kids.push(el('div', { class: 'empty', text: t('emptyRecs', { x: inText(sh.end) }) }));
    } else {
      const short = list('days'), full = list('full');
      S.recs.forEach((r, i) => {
        const lvl = levelOf(r.score);
        const when = r.off === 0 ? t('today') : r.off === 1 ? t('tomorrow', { day: short[r.d] }) : full[r.d];
        const minsAway = r.off * 1440 + r.start - (now.h * 60 + now.m);
        const a = Math.round(r.bw * 100);
        const arrive = r.bd == null ? t('arriveW', { a }) : t('arriveWD', { a, b: Math.round(r.bd * 100) });
        const b = el('button', { class: 'rec-card', type: 'button', 'aria-pressed': i === S.sel ? 'true' : 'false' },
          el('span', { class: 'rk', text: String(i + 1) }),
          el('span', { class: 'rec-body' },
            el('span', { class: 't', text: t('recTitle', { when, from: clock(r.start), to: clock(r.end) }) }),
            el('span', { class: 's', text: t('startsIn', { x: inText(minsAway) }) }),
            bar(), steps(r.start),
            el('span', { class: 'l' }, el('i', { class: 'sw', style: 'background:var(--h' + lvl + ')' }), arrive)));
        b.addEventListener('click', () => { S.sel = i; renderRecs(); });
        kids.push(b);
      });
    }
    box.replaceChildren(...kids.filter(Boolean));
    paintGrid();
  }

  function setCell(k, on) { if (on) S.blocked.add(k); else S.blocked.delete(k); }
  function wireGrid() {
    const grid = $('#grid');
    const tip = $('#tip');
    let paint = null, mouseHandled = false;

    grid.addEventListener('pointerdown', e => {
      const c = e.target.closest('.cell');
      if (!c || e.pointerType !== 'mouse') return;
      e.preventDefault();
      mouseHandled = true;
      paint = !S.blocked.has(c.dataset.k);
      setCell(c.dataset.k, paint);
      renderRecs();
    });
    grid.addEventListener('pointerover', e => {
      const c = e.target.closest('.cell');
      if (!c) return;
      if (paint !== null && e.pointerType === 'mouse') { setCell(c.dataset.k, paint); renderRecs(); }
      showTip(c);
    });
    grid.addEventListener('pointerout', e => { if (e.target.closest('.cell')) tip.hidden = true; });
    grid.addEventListener('focusin', e => { const c = e.target.closest('.cell'); if (c) showTip(c); });
    grid.addEventListener('focusout', () => { tip.hidden = true; });
    window.addEventListener('pointerup', () => { if (paint !== null) { paint = null; saveTimetable(); } });
    grid.addEventListener('click', e => {
      const c = e.target.closest('.cell');
      if (!c) return;
      if (mouseHandled) { mouseHandled = false; return; }   // mouse already handled on pointerdown
      setCell(c.dataset.k, !S.blocked.has(c.dataset.k));
      saveTimetable(); renderRecs();
    });

    function showTip(c) {
      const d = +c.dataset.d, h = +c.dataset.h, v = typicalBusy(d, h), blocked = S.blocked.has(c.dataset.k);
      tip.replaceChildren(
        el('strong', { text: t('tipRange', { day: list('full')[d], from: pad(h) + ':00', to: pad(h + 1) + ':00' }) }), el('br'),
        document.createTextNode(blocked ? t('tipBlk') : t('tipLevel', { lvl: levelName(levelOf(v)), pct: Math.round(v * 100) })));
      tip.hidden = false;
      const r = c.getBoundingClientRect(), tr = tip.getBoundingClientRect();
      const left = Math.max(8, Math.min(window.innerWidth - tr.width - 8, r.left + r.width / 2 - tr.width / 2));
      const top = r.top - tr.height - 8 < 8 ? r.bottom + 8 : r.top - tr.height - 8;
      tip.style.left = left + 'px'; tip.style.top = top + 'px';
    }
  }

  /* ---------- language ---------- */
  function applyLang() {
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'en';
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t(n.dataset.i18n); });
    document.querySelectorAll('[data-i18n-aria]').forEach(n => n.setAttribute('aria-label', t(n.dataset.i18nAria)));
    $('#lang-en').setAttribute('aria-pressed', lang === 'en' ? 'true' : 'false');
    $('#lang-zh').setAttribute('aria-pressed', lang === 'zh' ? 'true' : 'false');
    const hall = $('#hall');
    const keepHall = hall.value || String(S.hall);
    hall.replaceChildren(...HALLS.map(n => el('option', { value: n, text: t('hallOpt', { n }) })));
    hall.value = keepHall;
    const mv = $('#move');
    const keepMove = mv.value || String(S.moveMin);
    mv.replaceChildren(...MOVE_CHOICES.map(n => el('option', { value: n, text: t('fMin', { n }) })));
    mv.value = keepMove;
    buildGrid();
    renderRecs();
    if (S.raw.length) renderNow();
  }
  function setLang(next) {
    if (next === lang) return;
    lang = next;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* ignore */ }
    applyLang();
  }

  /* ---------- tabs + wiring ---------- */
  function showTab(name) {
    S.tab = name === 'plan' ? 'plan' : 'now';
    for (const k of ['now', 'plan']) {
      const on = k === S.tab;
      $('#panel-' + k).hidden = !on;
      const b = $('#tab-' + k);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
    }
    if (S.tab === 'plan') renderRecs();
  }
  function onPlanChange() { S.sel = 0; savePrefs(); renderRecs(); }
  function init() {
    S.blocked = loadTimetable() || sampleTimetable();
    loadPrefs();
    wireGrid();
    applyLang();
    $('#hall').value = String(S.hall);
    $('#move').value = String(S.moveMin);
    $('#hall').addEventListener('change', () => { S.hall = +$('#hall').value; load(); });
    $('#refresh').addEventListener('click', load);
    $('#tryLive').addEventListener('click', () => { S.source = 'live'; load(); });
    $('#lang-en').addEventListener('click', () => setLang('en'));
    $('#lang-zh').addEventListener('click', () => setLang('zh'));

    $('#dry-minus').addEventListener('click', () => { S.dryMin = Math.max(DRY_MIN, S.dryMin - DRY_STEP); onPlanChange(); });
    $('#dry-plus').addEventListener('click', () => { S.dryMin = Math.min(DRY_MAX, S.dryMin + DRY_STEP); onPlanChange(); });
    $('#use-dry').addEventListener('change', e => { S.useDryer = e.target.checked; onPlanChange(); });
    $('#move').addEventListener('change', e => { S.moveMin = +e.target.value; onPlanChange(); });
    $('#sample').addEventListener('click', () => { S.blocked = sampleTimetable(); saveTimetable(); renderRecs(); });
    $('#clear').addEventListener('click', () => { S.blocked = new Set(); saveTimetable(); renderRecs(); });

    const tabs = [$('#tab-now'), $('#tab-plan')];
    tabs.forEach((b, i) => {
      b.addEventListener('click', () => { location.hash = i ? 'plan' : 'now'; showTab(i ? 'plan' : 'now'); });
      b.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const j = 1 - i; tabs[j].focus(); tabs[j].click(); }
      });
    });
    window.addEventListener('hashchange', () => showTab(location.hash.slice(1)));
    showTab(location.hash.slice(1));

    // one clock: refresh stamp every second, poll on the interval, and stay quiet while hidden
    setInterval(() => {
      if (document.hidden) return;
      renderStamp();
      if (Date.now() - S.fetchedAt >= REFRESH_MS) load();
      const m = hkNow().m;
      if (m !== S.lastMinute) { S.lastMinute = m; if (S.tab === 'plan') renderRecs(); }
    }, 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - S.fetchedAt >= REFRESH_MS) load(); });

    load();
  }

  window.LaundryPlanner = { recommend, shapeOf, busyAt, typicalBusy, parseMachine, parseTime, demoData, clock, STR, setLang, WASH_MIN, DRY_STEP, DRY_MIN, DRY_MAX };   // handy for console experiments
  init();
})();
</script>
